<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Confirmed — ReelExpress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-midnight: #0A1128;
      --card-slate: #1E293B;
      --accent-cyan: #00E5FF;
      --accent-cyan-hover: #00c4db;
      --text-white: #FFFFFF;
      --text-muted: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.1);
      --success-green: #10B981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-midnight); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .container { max-width: 680px; width: 100%; }
    .header { text-align: center; margin-bottom: 32px; }
    .logo { font-size: 24px; font-weight: 800; color: var(--text-white); margin-bottom: 20px; display: inline-block; text-decoration: none; }
    .logo span { color: var(--accent-cyan); }
    .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success-green); color: var(--success-green); padding: 8px 16px; border-radius: 9999px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; line-height: 1.2; }
    p.subtitle { color: var(--text-muted); font-size: 16px; line-height: 1.5; }
    .card { background: var(--card-slate); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; margin-bottom: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    .step-indicator { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .step-number { background: var(--accent-cyan); color: var(--bg-midnight); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
    .step-title { font-weight: 700; font-size: 16px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-white); }
    label span.req { color: var(--accent-cyan); }
    input[type="text"], input[type="email"], input[type="tel"], input[type="url"], select, textarea { width: 100%; background: rgba(10, 17, 40, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; color: var(--text-white); font-size: 15px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan); }
    textarea { resize: vertical; min-height: 80px; }
    .checkbox-group { display: flex; align-items: flex-start; gap: 12px; margin-top: 24px; margin-bottom: 24px; }
    .checkbox-group input { margin-top: 3px; accent-color: var(--accent-cyan); width: 18px; height: 18px; }
    .checkbox-group label { font-size: 13px; line-height: 1.4; color: var(--text-muted); font-weight: 400; }
    button.btn-submit { width: 100%; background: var(--accent-cyan); color: var(--bg-midnight); border: none; border-radius: 8px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button.btn-submit:hover { background: var(--accent-cyan-hover); }
    .footer { text-align: center; color: var(--text-muted); font-size: 14px; }
    .footer a { color: var(--accent-cyan); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="logo">Reel<span>Express</span></a>
      <div><div class="badge">Payment Successful</div></div>
      <h1>Complete Your Property Intake</h1>
      <p class="subtitle">Submit your listing photos and details below. Our studio will produce and deliver your high-converting 9:16 reels within 48 hours.</p>
    </div>
    <div class="card">
      <div class="step-indicator">
        <div class="step-number">✓</div>
        <div class="step-title">12-Point Asset Submission Form</div>
      </div>
      <form action="mailto:ryanduncan.rd14@gmail.com" method="post" enctype="text/plain">
        <div class="form-group"><label>1. Agency / Company Name <span class="req">*</span></label><input type="text" name="agency_name" placeholder="e.g. Cauldwell Property Services" required></div>
        <div class="form-group"><label>2. Primary Contact Person <span class="req">*</span></label><input type="text" name="contact_name" placeholder="e.g. Jason Smith" required></div>
        <div class="form-group"><label>3. Contact Email Address <span class="req">*</span></label><input type="email" name="contact_email" placeholder="e.g. jason@cauldwellproperty.co.uk" required></div>
        <div class="form-group"><label>4. Phone / WhatsApp Number <span class="req">*</span></label><input type="tel" name="phone" placeholder="e.g. +44 1908 304480" required></div>
        <div class="form-group"><label>5. Purchased Package / Order Ref <span class="req">*</span></label><select name="package" required><option value="Starter (£49)">Starter Package (£49 — 3 Reels)</option><option value="Growth (£149/mo)">Growth Subscription (£149/mo — 12 Reels)</option><option value="Agency Premium (£249/mo)">Agency Premium (£249/mo — 20 Reels)</option></select></div>
        <div class="form-group"><label>6. Property Full Address & Postcode <span class="req">*</span></label><input type="text" name="property_address" placeholder="e.g. 14 High Street, Olney, MK46 4BB" required></div>
        <div class="form-group"><label>7. Guide Price & Key Specifications <span class="req">*</span></label><input type="text" name="price_and_specs" placeholder="e.g. £550,000 — 4 Bed, 2 Bath, Detached" required></div>
        <div class="form-group"><label>8. Top 3–5 USPs / Highlights <span class="req">*</span></label><textarea name="usps" placeholder="e.g. South-facing garden, bespoke quartz kitchen, underfloor heating, detached garden office" required></textarea></div>
        <div class="form-group"><label>9. Property Photos Link (Google Drive, Dropbox, WeTransfer) <span class="req">*</span></label><input type="url" name="photos_link" placeholder="https://drive.google.com/..." required></div>
        <div class="form-group"><label>10. Agency Logo Link & Brand Colours (Optional)</label><input type="text" name="logo_and_brand" placeholder="Logo Drive link or hex codes (e.g. #0A1128)"></div>
        <div class="form-group"><label>11. Exact Call-to-Action (CTA) for Final Screen <span class="req">*</span></label><input type="text" name="cta" placeholder="e.g. Call 01908 304480 or DM @cauldwell_mk" required></div>
        <div class="checkbox-group"><input type="checkbox" id="vendor_rights" name="vendor_rights" required checked><label for="vendor_rights">I confirm that our agency holds the necessary vendor authority and image licensing rights to use these photographs for promotional video production. <span class="req">*</span></label></div>
        <button type="submit" class="btn-submit">Submit Property Assets (Start 48h Production)</button>
      </form>
    </div>
    <div class="footer"><p>Questions? Email <a href="mailto:ryan@reelexpress.co.uk">ryan@reelexpress.co.uk</a></p></div>
  </div>
</body>
</html>
